<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{% if page.summary %}{{ page.summary | strip_html | escape }}{% else %}{{ site.description | escape }}{% endif %}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
{% assign nav = page.nav %}{% if page.collection == "posts" %}{% assign nav = "notes" %}{% endif %}
<div class="layout">
  <aside class="side">
    <div class="side-in">
      <a class="me" href="{{ '/' | relative_url }}">
        <span class="me-name">Julio Carneiro</span>
        <span class="me-role">Data Analytics</span>
      </a>
      <nav class="menu" aria-label="Main">
        <a href="{{ '/' | relative_url }}"{% if nav == "home" %} class="on" aria-current="page"{% endif %}>home</a>
        <a href="{{ '/notes/' | relative_url }}"{% if nav == "notes" %} class="on" aria-current="page"{% endif %}>notes</a>
        <a href="{{ '/projects/' | relative_url }}"{% if nav == "projects" %} class="on" aria-current="page"{% endif %}>projects</a>
        <a href="{{ '/resources/' | relative_url }}"{% if nav == "resources" %} class="on" aria-current="page"{% endif %}>resources</a>
        <a href="{{ '/about/' | relative_url }}"{% if nav == "about" %} class="on" aria-current="page"{% endif %}>about</a>
      </nav>
      <div class="side-h">elsewhere</div>
      <nav class="menu small" aria-label="Elsewhere">
        <a href="{{ site.links.linkedin }}" target="_blank" rel="noopener noreferrer">linkedin</a>
        <a href="{{ site.links.github }}" target="_blank" rel="noopener noreferrer">github</a>
        <a href="mailto:{{ site.links.email }}">email</a>
        <a href="{{ site.links.resume | relative_url }}" target="_blank" rel="noopener noreferrer">resume</a>
      </nav>
      <div class="side-foot">Toronto, Canada</div>
    </div>
  </aside>

  <main class="main">
    <div class="inner">
      {{ content }}
    </div>
    <footer class="foot">© {{ site.time | date: "%Y" }} Julio Carneiro</footer>
  </main>
</div>

<script>
  (function () {
    // Tag filter on list pages
    var bar = document.querySelector('[data-filter]');
    if (bar) {
      var items = Array.prototype.slice.call(document.querySelectorAll('[data-tags]'));
      var count = document.getElementById('count');
      bar.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var tag = b.getAttribute('data-tag'), n = 0;
        Array.prototype.forEach.call(bar.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', x === b); });
        items.forEach(function (it) {
          var show = tag === 'all' || (' ' + it.getAttribute('data-tags') + ' ').indexOf(' ' + tag + ' ') > -1;
          it.hidden = !show; if (show) n++;
        });
        if (count) count.textContent = n + (n === 1 ? ' item' : ' items');
      });
    }
    // Copy buttons on code blocks in notes
    Array.prototype.forEach.call(document.querySelectorAll('.post-body pre'), function (pre) {
      var b = document.createElement('button');
      b.className = 'copy'; b.type = 'button'; b.textContent = 'copy';
      b.addEventListener('click', function () {
        navigator.clipboard.writeText(pre.innerText).then(function () { b.textContent = 'copied'; setTimeout(function () { b.textContent = 'copy'; }, 1400); });
      });
      pre.parentNode.insertBefore(b, pre);
      pre.parentNode.classList.add('has-copy');
    });
  })();
</script>
</body>
</html>
