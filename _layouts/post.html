---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} · {% for t in page.tags %}<span class="tag">#{{ t }}</span> {% endfor %}{% endif %}</p>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/notes/' | relative_url }}">← all notes</a></p>
</article>
