<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Julio Carneiro, data analyst">
  <defs>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" fill-opacity="0.025"/>
    </pattern>
    <style>
      .m { font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1280" height="300" fill="#081321"/>
  <rect x="20" y="20" width="1240" height="260" fill="#0B1A2C" stroke="#23405F"/>
  <rect x="20" y="20" width="1240" height="34" fill="#102338" stroke="#23405F"/>
  <rect x="38" y="32" width="11" height="11" fill="#18304B" stroke="#23405F"/>
  <rect x="56" y="32" width="11" height="11" fill="#18304B" stroke="#23405F"/>
  <rect x="74" y="32" width="11" height="11" fill="#18304B" stroke="#23405F"/>
  <text x="640" y="42" text-anchor="middle" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#7F96AE">julio@toronto: ~/portfolio</text>
  <rect x="20" y="54" width="1240" height="226" fill="url(#scan)"/>
  <text x="56" y="100" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="18"><tspan fill="#8FD694">julio@toronto</tspan><tspan fill="#7F96AE">:</tspan><tspan fill="#E8B04A">~</tspan><tspan fill="#7F96AE">$ </tspan><tspan fill="#D7E1EC">whoami</tspan></text>
  <text x="54" y="172" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="64" font-weight="700" fill="#E8B04A" letter-spacing="-1">Julio Carneiro</text>
  <text x="56" y="214" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#D7E1EC">Data analyst. I find where profit is lost and show leaders what to fix first.</text>
  <text x="56" y="252" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#7F96AE">Excel, Power BI, SQL, Python, Tableau. Toronto, ON</text>
  <rect class="cursor" x="552" y="236" width="10" height="20" fill="#E8B04A"/>
</svg>
